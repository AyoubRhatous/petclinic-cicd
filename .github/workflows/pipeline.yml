name: Petclinic CI/CD

on:
  repository_dispatch:
    types:
      - app-commit

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. Detect which services changed
  # ============================================================
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    outputs:
      customers: ${{ steps.changes.outputs.customers }}
      vets: ${{ steps.changes.outputs.vets }}
      visits: ${{ steps.changes.outputs.visits }}
      frontend: ${{ steps.changes.outputs.frontend }}
      all: ${{ steps.changes.outputs.all }}

    steps:

      - name: Checkout application
        uses: actions/checkout@v4
        with:
          repository: AyoubRhatous/petclinic-microservices
          ref: ${{ github.event.client_payload.sha }}
          fetch-depth: 0

      - name: Detect changes
        id: changes
        shell: bash
        run: |

          SHA="${{ github.event.client_payload.sha }}"

          echo "Analyzing commit: $SHA"

          CHANGED_FILES=$(git diff-tree \
            --no-commit-id \
            --name-only \
            -r \
            "$SHA")

          echo "Changed files:"
          echo "$CHANGED_FILES"

          CUSTOMERS=false
          VETS=false
          VISITS=false
          FRONTEND=false
          ALL=false

          # Root Maven configuration changed
          if echo "$CHANGED_FILES" | grep -qE '^(pom.xml|.mvn/|mvnw|mvnw.cmd)'; then
            ALL=true
          fi

          # Customers
          if echo "$CHANGED_FILES" | grep -q '^petclinic-customers-service/'; then
            CUSTOMERS=true
          fi

          # Vets
          if echo "$CHANGED_FILES" | grep -q '^petclinic-vets-service/'; then
            VETS=true
          fi

          # Visits
          if echo "$CHANGED_FILES" | grep -q '^petclinic-visits-service/'; then
            VISITS=true
          fi

          # Frontend
          if echo "$CHANGED_FILES" | grep -q '^petclinic-frontend/'; then
            FRONTEND=true
          fi

          echo "customers=$CUSTOMERS" >> "$GITHUB_OUTPUT"
          echo "vets=$VETS" >> "$GITHUB_OUTPUT"
          echo "visits=$VISITS" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "all=$ALL" >> "$GITHUB_OUTPUT"


  # ============================================================
  # 2. Build Customers
  # ============================================================
  build-customers:
    name: Build Customers Service
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.customers == 'true' ||
      needs.detect-changes.outputs.all == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout application
        uses: actions/checkout@v4
        with:
          repository: AyoubRhatous/petclinic-microservices
          ref: ${{ github.event.client_payload.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Customers Service
        run: |
          mvn -pl petclinic-customers-service -am clean verify


  # ============================================================
  # 3. Build Vets
  # ============================================================
  build-vets:
    name: Build Vets Service
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.vets == 'true' ||
      needs.detect-changes.outputs.all == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout application
        uses: actions/checkout@v4
        with:
          repository: AyoubRhatous/petclinic-microservices
          ref: ${{ github.event.client_payload.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Vets Service
        run: |
          ./mvnw -pl petclinic-vets-service -am clean verify


  # ============================================================
  # 4. Build Visits
  # ============================================================
  build-visits:
    name: Build Visits Service
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.visits == 'true' ||
      needs.detect-changes.outputs.all == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout application
        uses: actions/checkout@v4
        with:
          repository: AyoubRhatous/petclinic-microservices
          ref: ${{ github.event.client_payload.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Visits Service
        run: |
          ./mvnw -pl petclinic-visits-service -am clean verify


  # ============================================================
  # 5. Build Frontend
  # ============================================================
  build-frontend:
    name: Build Frontend
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.all == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout application
        uses: actions/checkout@v4
        with:
          repository: AyoubRhatous/petclinic-microservices
          ref: ${{ github.event.client_payload.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Frontend
        run: |
          ./mvnw -pl petclinic-frontend -am clean verify
